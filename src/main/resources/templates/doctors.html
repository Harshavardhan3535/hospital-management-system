<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS — Doctors</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="navbar-brand"><a href="/dashboard">🏥 HMS</a></div>
        <div class="navbar-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/patients">Patients</a>
            <a href="/doctors" class="active">Doctors</a>
            <a href="/appointments">Appointments</a>
        </div>
        <div class="navbar-user">
            <span id="userInfo">Welcome</span>
            <button class="btn btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="main-container">
        <div class="page-header-row">
            <div>
                <h1>Doctors</h1>
                <p>Manage all doctors in the system</p>
            </div>
            <button class="btn btn-primary" onclick="openDoctorModal()">+ Add Doctor</button>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name, specialization, or email..." oninput="filterDoctors()" />
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Specialization</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="doctorTableBody">
                    <tr><td colspan="7" class="loading">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <p>No doctors found.</p>
            <button class="btn btn-primary" onclick="openDoctorModal()">Add your first doctor</button>
        </div>
    </main>

    <!-- ===== MODAL: Add/Edit Doctor ===== -->
    <div id="doctorModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add Doctor</h2>
                <button class="modal-close" onclick="closeDoctorModal()">✕</button>
            </div>
            <form id="doctorForm" class="modal-body" onsubmit="saveDoctor(event)">
                <input type="hidden" id="doctorId" />

                <div class="form-group">
                    <label for="dName">Name *</label>
                    <input type="text" id="dName" required maxlength="100" />
                </div>

                <div class="form-group">
                    <label for="dSpecialization">Specialization *</label>
                    <input type="text" id="dSpecialization" required maxlength="100" />
                </div>

                <div class="form-group">
                    <label for="dEmail">Email *</label>
                    <input type="email" id="dEmail" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dPhone">Phone</label>
                        <input type="text" id="dPhone" maxlength="15" />
                    </div>
                    <div class="form-group">
                        <label for="dDepartmentId">Department *</label>
                        <select id="dDepartmentId" required>
                            <option value="">-- Loading --</option>
                        </select>
                    </div>
                </div>

                <div id="formError" class="error-message" style="display: none;"></div>

                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeDoctorModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== MODAL: Confirm Delete ===== -->
    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2>Delete Doctor?</h2>
                <button class="modal-close" onclick="closeDeleteModal()">✕</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete <strong id="deleteName"></strong>?</p>
                <p class="text-muted">This action cannot be undone.</p>
                <div class="modal-footer">
                    <button class="btn" onclick="closeDeleteModal()">Cancel</button>
                    <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/auth.js}"></script>
    <script th:src="@{/js/doctors.js}"></script>
</body>
</html>
