<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMS — Patients</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="navbar-brand"><a href="/dashboard">🏥 HMS</a></div>
        <div class="navbar-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/patients" class="active">Patients</a>
            <a href="/doctors">Doctors</a>
            <a href="/appointments">Appointments</a>
        </div>
        <div class="navbar-user">
            <span id="userInfo">Welcome</span>
            <button class="btn btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="main-container">
        <div class="page-header-row">
            <div>
                <h1>Patients</h1>
                <p>Manage all patients in the system</p>
            </div>
            <button class="btn btn-primary" onclick="openPatientModal()">+ Add Patient</button>
        </div>

        <!-- Search bar -->
        <div class="search-bar">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search by name, email, or phone..." 
                oninput="filterPatients()"
            />
        </div>

        <!-- Table -->
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>DOB</th>
                        <th>Blood Group</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <tr><td colspan="7" class="loading">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Empty state -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <p>No patients found.</p>
            <button class="btn btn-primary" onclick="openPatientModal()">Add your first patient</button>
        </div>
    </main>

    <!-- ===== MODAL: Add/Edit Patient ===== -->
    <div id="patientModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Add Patient</h2>
                <button class="modal-close" onclick="closePatientModal()">✕</button>
            </div>
            <form id="patientForm" class="modal-body" onsubmit="savePatient(event)">
                <input type="hidden" id="patientId" />

                <div class="form-group">
                    <label for="pName">Name *</label>
                    <input type="text" id="pName" required maxlength="100" />
                </div>

                <div class="form-group">
                    <label for="pEmail">Email *</label>
                    <input type="email" id="pEmail" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="pPhone">Phone</label>
                        <input type="text" id="pPhone" maxlength="15" />
                    </div>
                    <div class="form-group">
                        <label for="pBloodGroup">Blood Group</label>
                        <select id="pBloodGroup">
                            <option value="">-- Select --</option>
                            <option>A+</option>
                            <option>A-</option>
                            <option>B+</option>
                            <option>B-</option>
                            <option>AB+</option>
                            <option>AB-</option>
                            <option>O+</option>
                            <option>O-</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="pDob">Date of Birth</label>
                    <input type="date" id="pDob" />
                </div>

                <div class="form-group">
                    <label for="pAddress">Address</label>
                    <textarea id="pAddress" rows="2"></textarea>
                </div>

                <div id="formError" class="error-message" style="display: none;"></div>

                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closePatientModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== MODAL: Confirm Delete ===== -->
    <div id="deleteModal" class="modal-overlay" style="display: none;">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2>Delete Patient?</h2>
                <button class="modal-close" onclick="closeDeleteModal()">✕</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete <strong id="deleteName"></strong>?</p>
                <p class="text-muted">This action cannot be undone.</p>
                <div class="modal-footer">
                    <button class="btn" onclick="closeDeleteModal()">Cancel</button>
                    <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/auth.js}"></script>
    <script th:src="@{/js/patients.js}"></script>
</body>
</html>
